services:
 
  travel-app:
    build:
     context: .
     dockerfile: Dockerfile

    container_name: travel_app
    ports:
     - "8085:80"

    environment:
     DB_HOST: ${DB_HOST}
     DB_PORT: ${DB_PORT}
     POSTGRES_DB: ${POSTGRES_DB}
     POSTGRES_USER: ${POSTGRES_USER}
     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./src:/var/www/html

    networks:
      - travel-network

    depends_on:
     travel_db:
       condition: service_healthy

    restart: unless-stopped

  service:
   adminer:
    image: adminer:latest
    container_name: dar-as-safar-adminer
    restart: unless-stopped
    ports:
      - "8085:8080"
    depends_on:
      - postgres

  travel_db:
   image: postgres:15-alpine

   container_name: travel-compose-db

   environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

   volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

   networks:
      - travel-network
    
   healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

   restart: always

volumes:
  pgdata:
    driver: local


networks:
  travel-network:
    driver: bridge
